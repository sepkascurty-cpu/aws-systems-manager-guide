<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1180" viewBox="0 0 1200 1180" font-family="Arial, Helvetica, sans-serif">
  <rect width="1200" height="1180" fill="#ffffff"/>

  <!-- Title -->
  <text x="600" y="34" font-size="22" font-weight="bold" fill="#232F3E" text-anchor="middle">AWS Systems Manager — Fleet Operations Architecture</text>
  <text x="600" y="58" font-size="13" fill="#666666" text-anchor="middle">Operator &#8594; Systems Manager &#8594; SSM Agent &#8594; Managed Nodes &#8594; S3 / CloudWatch Logs</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#232F3E"/>
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#FF9900"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#1E8900"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#527FFF"/>
    </marker>
  </defs>

  <!-- Operator -->
  <g>
    <rect x="40" y="90" width="90" height="70" rx="6" fill="#F2F3F3" stroke="#232F3E" stroke-width="1.5"/>
    <circle cx="85" cy="116" r="12" fill="#FF9900"/>
    <path d="M70 152 q15 -18 30 0" stroke="#FF9900" stroke-width="5" fill="none"/>
    <text x="85" y="178" font-size="12" font-weight="bold" fill="#232F3E" text-anchor="middle">Operator</text>
    <text x="85" y="194" font-size="11" fill="#555555" text-anchor="middle">Console / CLI</text>
  </g>

  <!-- AWS Cloud outer box -->
  <rect x="170" y="80" width="1000" height="900" fill="none" stroke="#232F3E" stroke-width="2"/>
  <text x="190" y="106" font-size="16" font-weight="bold" fill="#232F3E">AWS Cloud — ap-southeast-1</text>

  <!-- Systems Manager control plane -->
  <g>
    <rect x="210" y="130" width="180" height="64" rx="4" fill="#FF9900"/>
    <text x="300" y="156" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">AWS Systems Manager</text>
    <text x="300" y="176" font-size="11" fill="#ffffff" text-anchor="middle">Control plane</text>
    <text x="300" y="212" font-size="11" fill="#232F3E" text-anchor="middle">Systems Manager</text>
    <text x="300" y="227" font-size="11" font-style="italic" fill="#555" text-anchor="middle">Fleet operations hub</text>
  </g>

  <!-- Capabilities row -->
  <g>
    <rect x="430" y="130" width="130" height="64" rx="4" fill="#FF9900"/>
    <text x="495" y="158" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Session Manager</text>
    <text x="495" y="176" font-size="11" fill="#ffffff" text-anchor="middle">Shell, no SSH</text>
    <text x="495" y="212" font-size="11" fill="#232F3E" text-anchor="middle">Session Manager</text>
    <text x="495" y="227" font-size="11" font-style="italic" fill="#555" text-anchor="middle">Browser shell access</text>
  </g>
  <g>
    <rect x="580" y="130" width="130" height="64" rx="4" fill="#FF9900"/>
    <text x="645" y="158" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Run Command</text>
    <text x="645" y="176" font-size="11" fill="#ffffff" text-anchor="middle">1 &#8594; 1,000 nodes</text>
    <text x="645" y="212" font-size="11" fill="#232F3E" text-anchor="middle">Run Command</text>
    <text x="645" y="227" font-size="11" font-style="italic" fill="#555" text-anchor="middle">Fleet-wide shell</text>
  </g>
  <g>
    <rect x="730" y="130" width="130" height="64" rx="4" fill="#FF9900"/>
    <text x="795" y="158" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Patch Manager</text>
    <text x="795" y="176" font-size="11" fill="#ffffff" text-anchor="middle">Scheduled patching</text>
    <text x="795" y="212" font-size="11" fill="#232F3E" text-anchor="middle">Patch Manager</text>
    <text x="795" y="227" font-size="11" font-style="italic" fill="#555" text-anchor="middle">Baselines + windows</text>
  </g>
  <g>
    <rect x="880" y="130" width="130" height="64" rx="4" fill="#FF9900"/>
    <text x="945" y="158" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Automation</text>
    <text x="945" y="176" font-size="11" fill="#ffffff" text-anchor="middle">Runbooks</text>
    <text x="945" y="212" font-size="11" fill="#232F3E" text-anchor="middle">Automation</text>
    <text x="945" y="227" font-size="11" font-style="italic" fill="#555" text-anchor="middle">Multi-step workflows</text>
  </g>

  <!-- Arrow: Operator -> Systems Manager -->
  <line x1="130" y1="125" x2="208" y2="162" stroke="#232F3E" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="150" y="105" font-size="11" fill="#232F3E" text-anchor="middle">IAM auth</text>

  <!-- Arrow: SSM -> capabilities -->
  <line x1="392" y1="162" x2="428" y2="162" stroke="#FF9900" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <!-- VPC box -->
  <rect x="200" y="260" width="940" height="560" fill="#EAF5E4" fill-opacity="0.45" stroke="#1E8900" stroke-width="2"/>
  <text x="220" y="286" font-size="15" font-weight="bold" fill="#1E8900">VPC — 10.0.0.0/16 (private subnets only, no port 22 open)</text>

  <!-- AZ-1 dashed box -->
  <rect x="220" y="300" width="440" height="490" fill="none" stroke="#1E8900" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="240" y="326" font-size="14" font-weight="bold" fill="#1E8900">Availability Zone 1 (ap-southeast-1a)</text>

  <!-- Subnet: app tier AZ-1 -->
  <rect x="240" y="340" width="400" height="200" fill="#D9EBFF" fill-opacity="0.6" stroke="#527FFF" stroke-width="1.5"/>
  <text x="256" y="364" font-size="13" font-weight="bold" fill="#527FFF">App subnet — 10.0.1.0/24 (private)</text>
  <g>
    <rect x="260" y="380" width="110" height="64" rx="4" fill="#FF9900"/>
    <text x="315" y="406" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">EC2</text>
    <text x="315" y="424" font-size="10" fill="#ffffff" text-anchor="middle">web-01</text>
    <text x="315" y="462" font-size="11" fill="#232F3E" text-anchor="middle">Amazon EC2</text>
    <text x="315" y="477" font-size="11" font-style="italic" fill="#555" text-anchor="middle">SSM Agent running</text>
  </g>
  <g>
    <rect x="400" y="380" width="110" height="64" rx="4" fill="#FF9900"/>
    <text x="455" y="406" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">EC2</text>
    <text x="455" y="424" font-size="10" fill="#ffffff" text-anchor="middle">web-02</text>
    <text x="455" y="462" font-size="11" fill="#232F3E" text-anchor="middle">Amazon EC2</text>
    <text x="455" y="477" font-size="11" font-style="italic" fill="#555" text-anchor="middle">SSM Agent running</text>
  </g>
  <g>
    <rect x="260" y="490" width="250" height="34" rx="4" fill="#F2F3F3" stroke="#232F3E" stroke-width="1"/>
    <text x="385" y="511" font-size="11" fill="#232F3E" text-anchor="middle">Tag: PatchGroup=web &#183; Role=web</text>
  </g>

  <!-- Subnet: db tier AZ-1 -->
  <rect x="240" y="560" width="400" height="200" fill="#D9EBFF" fill-opacity="0.6" stroke="#527FFF" stroke-width="1.5"/>
  <text x="256" y="584" font-size="13" font-weight="bold" fill="#527FFF">DB subnet — 10.0.3.0/24 (private)</text>
  <g>
    <rect x="260" y="600" width="110" height="64" rx="4" fill="#527FFF"/>
    <text x="315" y="626" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">RDS</text>
    <text x="315" y="644" font-size="10" fill="#ffffff" text-anchor="middle">PostgreSQL</text>
    <text x="315" y="682" font-size="11" fill="#232F3E" text-anchor="middle">Amazon RDS</text>
    <text x="315" y="697" font-size="11" font-style="italic" fill="#555" text-anchor="middle">Patched via its own window</text>
  </g>
  <g>
    <rect x="400" y="600" width="110" height="64" rx="4" fill="#FF9900"/>
    <text x="455" y="626" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">EC2</text>
    <text x="455" y="644" font-size="10" fill="#ffffff" text-anchor="middle">db-admin-01</text>
    <text x="455" y="682" font-size="11" fill="#232F3E" text-anchor="middle">Amazon EC2</text>
    <text x="455" y="697" font-size="11" font-style="italic" fill="#555" text-anchor="middle">SSM Agent running</text>
  </g>
  <g>
    <rect x="260" y="710" width="250" height="34" rx="4" fill="#F2F3F3" stroke="#232F3E" stroke-width="1"/>
    <text x="385" y="731" font-size="11" fill="#232F3E" text-anchor="middle">Tag: PatchGroup=db &#183; Role=db</text>
  </g>

  <!-- AZ-2 dashed box -->
  <rect x="680" y="300" width="440" height="490" fill="none" stroke="#1E8900" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="700" y="326" font-size="14" font-weight="bold" fill="#1E8900">Availability Zone 2 (ap-southeast-1b)</text>

  <!-- Subnet: app tier AZ-2 -->
  <rect x="700" y="340" width="400" height="200" fill="#D9EBFF" fill-opacity="0.6" stroke="#527FFF" stroke-width="1.5"/>
  <text x="716" y="364" font-size="13" font-weight="bold" fill="#527FFF">App subnet — 10.0.2.0/24 (private)</text>
  <g>
    <rect x="720" y="380" width="110" height="64" rx="4" fill="#FF9900"/>
    <text x="775" y="406" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">EC2</text>
    <text x="775" y="424" font-size="10" fill="#ffffff" text-anchor="middle">web-03</text>
    <text x="775" y="462" font-size="11" fill="#232F3E" text-anchor="middle">Amazon EC2</text>
    <text x="775" y="477" font-size="11" font-style="italic" fill="#555" text-anchor="middle">SSM Agent running</text>
  </g>
  <g>
    <rect x="860" y="380" width="110" height="64" rx="4" fill="#FF9900"/>
    <text x="915" y="406" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">EC2</text>
    <text x="915" y="424" font-size="10" fill="#ffffff" text-anchor="middle">app-01</text>
    <text x="915" y="462" font-size="11" fill="#232F3E" text-anchor="middle">Amazon EC2</text>
    <text x="915" y="477" font-size="11" font-style="italic" fill="#555" text-anchor="middle">SSM Agent running</text>
  </g>
  <g>
    <rect x="720" y="490" width="250" height="34" rx="4" fill="#F2F3F3" stroke="#232F3E" stroke-width="1"/>
    <text x="845" y="511" font-size="11" fill="#232F3E" text-anchor="middle">Tag: PatchGroup=web &#183; Role=app</text>
  </g>

  <!-- Subnet: mgmt tier AZ-2 -->
  <rect x="700" y="560" width="400" height="200" fill="#D9EBFF" fill-opacity="0.6" stroke="#527FFF" stroke-width="1.5"/>
  <text x="716" y="584" font-size="13" font-weight="bold" fill="#527FFF">Mgmt subnet — 10.0.4.0/24 (private)</text>
  <g>
    <rect x="720" y="600" width="110" height="64" rx="4" fill="#FF9900"/>
    <text x="775" y="626" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">EC2</text>
    <text x="775" y="644" font-size="10" fill="#ffffff" text-anchor="middle">on-prem-01</text>
    <text x="775" y="682" font-size="11" fill="#232F3E" text-anchor="middle">Managed instance</text>
    <text x="775" y="697" font-size="11" font-style="italic" fill="#555" text-anchor="middle">Hybrid activation</text>
  </g>
  <g>
    <rect x="860" y="600" width="150" height="64" rx="4" fill="#1E8900"/>
    <text x="935" y="626" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">VPC Endpoints</text>
    <text x="935" y="644" font-size="10" fill="#ffffff" text-anchor="middle">ssm &#183; ssmmessages</text>
    <text x="935" y="682" font-size="11" fill="#232F3E" text-anchor="middle">VPC Endpoints</text>
    <text x="935" y="697" font-size="11" font-style="italic" fill="#555" text-anchor="middle">Agent dials out on 443</text>
  </g>
  <g>
    <rect x="720" y="710" width="290" height="34" rx="4" fill="#F2F3F3" stroke="#232F3E" stroke-width="1"/>
    <text x="865" y="731" font-size="11" fill="#232F3E" text-anchor="middle">No inbound ports — agent initiates outbound only</text>
  </g>

  <!-- Arrows: SSM control plane down to VPC -->
  <line x1="300" y1="196" x2="300" y2="258" stroke="#FF9900" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="310" y="232" font-size="11" fill="#FF9900">commands + sessions</text>
  <line x1="795" y1="196" x2="795" y2="258" stroke="#FF9900" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="805" y="232" font-size="11" fill="#FF9900">patch instructions</text>

  <!-- Parameter Store + KMS (right of VPC, inside AWS cloud box) -->
  <g>
    <rect x="200" y="850" width="200" height="64" rx="4" fill="#1E8900"/>
    <text x="300" y="876" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Parameter Store</text>
    <text x="300" y="894" font-size="10" fill="#ffffff" text-anchor="middle">Config + secrets</text>
    <text x="300" y="932" font-size="11" fill="#232F3E" text-anchor="middle">Parameter Store</text>
    <text x="300" y="947" font-size="11" font-style="italic" fill="#555" text-anchor="middle">/prod/db/password</text>
  </g>
  <g>
    <rect x="420" y="850" width="200" height="64" rx="4" fill="#DD344C"/>
    <text x="520" y="876" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">AWS KMS</text>
    <text x="520" y="894" font-size="10" fill="#ffffff" text-anchor="middle">Encrypts SecureString</text>
    <text x="520" y="932" font-size="11" fill="#232F3E" text-anchor="middle">AWS KMS</text>
    <text x="520" y="947" font-size="11" font-style="italic" fill="#555" text-anchor="middle">Envelope encryption</text>
  </g>
  <g>
    <rect x="640" y="850" width="200" height="64" rx="4" fill="#1E8900"/>
    <text x="740" y="876" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Amazon S3</text>
    <text x="740" y="894" font-size="10" fill="#ffffff" text-anchor="middle">Session + patch logs</text>
    <text x="740" y="932" font-size="11" fill="#232F3E" text-anchor="middle">Amazon S3</text>
    <text x="740" y="947" font-size="11" font-style="italic" fill="#555" text-anchor="middle">Audit archive</text>
  </g>
  <g>
    <rect x="860" y="850" width="200" height="64" rx="4" fill="#527FFF"/>
    <text x="960" y="876" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">CloudWatch Logs</text>
    <text x="960" y="894" font-size="10" fill="#ffffff" text-anchor="middle">Session output</text>
    <text x="960" y="932" font-size="11" fill="#232F3E" text-anchor="middle">CloudWatch Logs</text>
    <text x="960" y="947" font-size="11" font-style="italic" fill="#555" text-anchor="middle">Live session stream</text>
  </g>

  <!-- Arrows: VPC -> lower services -->
  <line x1="440" y1="820" x2="300" y2="848" stroke="#1E8900" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="330" y="845" font-size="11" fill="#1E8900">reads config</text>
  <line x1="700" y1="820" x2="740" y2="848" stroke="#1E8900" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="690" y="845" font-size="11" fill="#1E8900">logs</text>
  <line x1="520" y1="850" x2="400" y2="850" stroke="#DD344C" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="440" y="842" font-size="11" fill="#DD344C">decrypt</text>

  <!-- CloudTrail note -->
  <text x="600" y="1000" font-size="13" fill="#232F3E" text-anchor="middle">Every API call (StartSession, SendCommand, PutParameter) is recorded in <tspan font-weight="bold">AWS CloudTrail</tspan> — full audit trail, no extra setup.</text>
  <text x="600" y="1024" font-size="13" fill="#232F3E" text-anchor="middle">Instances carry the <tspan font-weight="bold">AmazonSSMManagedInstanceCore</tspan> policy on their instance profile — the agent's passport to AWS.</text>

  <!-- Legend -->
  <text x="600" y="1075" font-size="13" font-weight="bold" fill="#232F3E" text-anchor="middle">Legend</text>
  <rect x="330" y="1090" width="18" height="18" fill="#FF9900"/>
  <text x="354" y="1104" font-size="12" fill="#232F3E">Compute / SSM</text>
  <rect x="490" y="1090" width="18" height="18" fill="#527FFF"/>
  <text x="514" y="1104" font-size="12" fill="#232F3E">Database / Logs</text>
  <rect x="640" y="1090" width="18" height="18" fill="#1E8900"/>
  <text x="664" y="1104" font-size="12" fill="#232F3E">Storage / VPC</text>
  <rect x="790" y="1090" width="18" height="18" fill="#DD344C"/>
  <text x="814" y="1104" font-size="12" fill="#232F3E">Security (KMS)</text>
  <rect x="930" y="1090" width="18" height="18" fill="none" stroke="#1E8900" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="954" y="1104" font-size="12" fill="#232F3E">Availability Zone</text>
</svg>
